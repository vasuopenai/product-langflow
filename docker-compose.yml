# Local stack: Postgres with pgvector, plus the API.
#   docker compose up -d db          # database only
#   docker compose up -d --build     # database + API on http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: off
    ports: ["127.0.0.1:5432:5432"]   # local machine only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  api:
    build: .
    environment:
      # food: USDA Branded Foods (current); off: the earlier Open Food Facts load.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/${APP_DB:-food}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OFF_EMBEDDER: ${OFF_EMBEDDER:-openai}
    ports: ["127.0.0.1:8000:8000"]   # local machine only
    depends_on:
      db: {condition: service_healthy}
  # Kroger price/aisle lookups by barcode (separate service; own `kroger` schema):
  #   docker compose up -d --build kroger      # http://127.0.0.1:8001
  kroger:
    build: {context: ., dockerfile: kroger_sync/Dockerfile}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/${APP_DB:-food}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      KROGER_MAX_CALLS_PER_DAY: ${KROGER_MAX_CALLS_PER_DAY:-9000}
      # https://api-ce.kroger.com/v1 for apps still in Kroger's Certification environment
      KROGER_API_BASE: ${KROGER_API_BASE:-https://api.kroger.com/v1}
    ports: ["127.0.0.1:8001:8001"]   # local machine only
    depends_on:
      db: {condition: service_healthy}
  # Whole Foods brand products from the USDA data (read-only):
  #   docker compose up -d --build wholefoods  # http://127.0.0.1:8002
  wholefoods:
    build: {context: ., dockerfile: wholefoods/Dockerfile}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/${APP_DB:-food}
    ports: ["127.0.0.1:8002:8002"]   # local machine only
    depends_on:
      db: {condition: service_healthy}
  # Mobile app gateway (scan, nearby store, ask, web results, review queue):
  #   docker compose up -d --build mobile      # http://127.0.0.1:8003/docs
  # MOBILE_BIND=0.0.0.0 lets a phone on the same Wi-Fi reach it (allow port 8003 in the firewall).
  mobile:
    build: {context: ., dockerfile: mobile_api/Dockerfile}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/${APP_DB:-food}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OFF_CHAT_MODEL: ${OFF_CHAT_MODEL:-gpt-4o}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      KROGER_API_BASE: ${KROGER_API_BASE:-https://api.kroger.com/v1}
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-gpt-4o}
      MOBILE_APP_KEY: ${MOBILE_APP_KEY:-}
      MOBILE_ADMIN_KEY: ${MOBILE_ADMIN_KEY:-}
      MOBILE_HOURLY_LIMIT: ${MOBILE_HOURLY_LIMIT:-60}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}   # shown on /privacy and /support
    ports: ["${MOBILE_BIND:-127.0.0.1}:8003:8003"]
    depends_on:
      db: {condition: service_healthy}
  # Catalog gap finder: Kroger catalog products missing from our database, staged for review.
  # Off by default; start with COMPOSE_PROFILES=catalog (or --profile catalog). docs/CATALOG_GAPS.md
  catalog:
    build: {context: ., dockerfile: catalog_gaps/Dockerfile}
    profiles: ["catalog"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/${APP_DB:-food}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      KROGER_API_BASE: ${KROGER_API_BASE:-https://api.kroger.com/v1}
      CATALOG_KROGER_CALLS_PER_DAY: ${CATALOG_KROGER_CALLS_PER_DAY:-2000}
      CATALOG_SECONDS_PER_CALL: ${CATALOG_SECONDS_PER_CALL:-6}
      CATALOG_RESEARCH_PER_DAY: ${CATALOG_RESEARCH_PER_DAY:-0}
      CATALOG_RECRAWL_DAYS: ${CATALOG_RECRAWL_DAYS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY}        # only used if research is turned on
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
