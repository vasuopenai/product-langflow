# Local stack: Postgres with pgvector, plus the API.
#   docker compose up -d db          # database only
#   docker compose up -d --build     # database + API on http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: off
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/off
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OFF_EMBEDDER: ${OFF_EMBEDDER:-openai}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
